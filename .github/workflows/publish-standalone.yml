name: Publish standalone Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK (GitHub runner only)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained single-file executable
        run: >-
          dotnet publish src/UniversalAudioDriver/UniversalAudioDriver.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ./artifacts/UniversalAudioDriver-win-x64

      - name: Upload standalone application
        uses: actions/upload-artifact@v4
        with:
          name: UniversalAudioDriver-win-x64
          path: ./artifacts/UniversalAudioDriver-win-x64/
          if-no-files-found: error
          retention-days: 30
