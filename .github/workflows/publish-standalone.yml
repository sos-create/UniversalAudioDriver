name: Publish standalone Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64, win-x86]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK (GitHub runner only)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate installer PowerShell syntax and guarded paths
        shell: pwsh
        run: |
          $script = (Resolve-Path "installer/Install-UniversalAudioDriver.ps1").Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "Installer PowerShell syntax validation failed."
          }
          $source = Get-Content $script -Raw
          if ($source -notmatch 'IsNullOrWhiteSpace\(\$DriverDirectory\)' -or
              $source -notmatch 'IsNullOrWhiteSpace\(\$ReportPath\)' -or
              $source -notmatch 'Join-Path -Path \$ScriptDirectory') {
            throw "Installer path guards are missing."
          }
          Write-Host "Installer syntax and empty-path guards validated."

      - name: Publish self-contained single-file executable
        run: >-
          dotnet publish src/UniversalAudioDriver/UniversalAudioDriver.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ./artifacts/UniversalAudioDriver-${{ matrix.runtime }}

      - name: Assemble installation bundle
        shell: pwsh
        run: |
          $publishDir = "./artifacts/UniversalAudioDriver-${{ matrix.runtime }}"
          Copy-Item "installer/Install-UniversalAudioDriver.ps1" $publishDir
          Copy-Item "installer/Install-UniversalAudioDriver.cmd" $publishDir
          Copy-Item "installer/README.md" "$publishDir/INSTALLATION-README.md"
          Copy-Item "Drivers" $publishDir -Recurse
          Compress-Archive -Path "$publishDir/*" -DestinationPath "./artifacts/UniversalAudioDriver-${{ matrix.runtime }}-installer.zip" -Force

      - name: Upload standalone application
        uses: actions/upload-artifact@v4
        with:
          name: UniversalAudioDriver-${{ matrix.runtime }}
          path: ./artifacts/UniversalAudioDriver-${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installation bundle
        uses: actions/upload-artifact@v4
        with:
          name: UniversalAudioDriver-installer-${{ matrix.runtime }}
          path: ./artifacts/UniversalAudioDriver-${{ matrix.runtime }}-installer.zip
          if-no-files-found: error
          retention-days: 30
